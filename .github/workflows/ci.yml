name: CI

on:
  pull_request:
  push:
    branches: [main, refactor/structure]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # What's New reads dates from history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fast, contributor-friendly check first: a bad catalog entry fails here
      # with a message that says how to fix it.
      - name: Validate catalog data
        run: npm run check:data

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
