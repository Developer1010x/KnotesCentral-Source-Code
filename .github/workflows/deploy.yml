name: Deploy to GitHub Pages

# The site is a static export, so publishing it is just "build and upload the
# out/ directory". The base path and the canonical URL are read back from the
# Pages API rather than hardcoded, so a rename of the repository — or moving it
# to a custom domain — needs no code change.

on:
  push:
    branches: [main, refactor/structure]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # What's New and the sitemap read dates from history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Only the default branch publishes, and only it may touch the Pages
      # API: the call needs `pages: write` against repository settings, and it
      # fails outright where Pages has never been enabled. A branch build is
      # here to prove the export still compiles, so it skips the lookup and
      # falls back to the defaults in src/lib/site.ts.
      - name: Configure Pages
        id: pages
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Validate the catalog
        run: npm run check:data

      - name: Build the static export
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Pages runs Jekyll over the artifact unless told not to, and Jekyll
      # drops every directory beginning with an underscore — including
      # _next/, which is the whole build.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Guarded for the same reason: a branch artifact carries no base path, so
  # publishing one would serve the live site with every asset URL broken.
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
